[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esqet"
version = "0.2.0"
description = "ESQET Computational Physics Framework"
authors = [{name = "ESQET Project"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0"
]

[project.scripts]
esqet-gr = "esqet.apps.cli.gr_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["esqet*", "src/esqet*"]
