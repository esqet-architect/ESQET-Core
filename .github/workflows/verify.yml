name: ESQET Canonical Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-golden-law:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Critical Mathematical Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy

    - name: Execute Numerical Optimization Pipeline
      run: |
        python esqet_canonical_verification.py
